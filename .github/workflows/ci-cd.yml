name: LEVIX CI/CD Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript Strict)
        run: npx tsc --noEmit

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  unit-and-security-tests:
    name: Vitest Unit & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite with Coverage
        run: npx vitest run --coverage

  e2e-playwright:
    name: Playwright E2E & Visual Regression
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-security-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          CI: true

      - name: Upload Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-to-hostinger:
    name: Zero-Downtime Hostinger VPS Deployment
    runs-on: ubuntu-latest
    needs: [e2e-playwright]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting LEVIX zero-downtime deployment on Hostinger VPS..."
            cd /var/www/thelevix.com

            # 1. Fetch latest release
            git fetch origin main
            git reset --hard origin/main

            # 2. Install dependencies & apply database migrations
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            # 3. Build optimized production assets
            npm run build

            # 4. Graceful zero-downtime PM2 reload
            pm2 reload ecosystem.config.cjs --update-env

            # 5. Automated Health Check Verification
            echo "🔍 Probing local application health..."
            sleep 3
            if curl -f http://127.0.0.1:3000/api/health; then
              echo "✅ Health check PASSED! Release is LIVE."
            else
              echo "❌ Health check FAILED! Executing emergency rollback..."
              git reset --hard HEAD@{1}
              npm ci
              npm run build
              pm2 reload ecosystem.config.cjs
              exit 1
            fi
