# Upstream Next.js Cluster on localhost
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name thelevix.com www.thelevix.com;

    # Certbot ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://thelevix.com$request_uri;
    }
}

# 2. WWW -> Non-WWW HTTPS Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thelevix.com;

    ssl_certificate /etc/letsencrypt/live/thelevix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thelevix.com/privkey.pem;

    return 301 https://thelevix.com$request_uri;
}

# 3. Main Production Secure Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thelevix.com;

    # Let's Encrypt TLS Configuration
    ssl_certificate /etc/letsencrypt/live/thelevix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thelevix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets Fast-Path Caching (1 Year Immutable)
    location /_next/static {
        alias /var/www/thelevix.com/.next/static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Directory Caching (Images, Icons)
    location /public {
        alias /var/www/thelevix.com/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Reverse Proxy to Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket support for Next.js HMR and live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward Client Identifiers for Rate Limiting & Audit Logs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming responses & invoice PDFs
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
